name: ABYSS WILD - Pruebas de codigo
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install FFmpeg for audio regression tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          command -v ffmpeg && command -v ffprobe
      - name: Install Python packages
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript motion geometry
        run: node --test render/tests/motion.test.mjs
      - name: Compile Remotion scene with test data
        run: |
          cd render
          npm install --no-audit --no-fund --prefer-offline
          trap 'rm -f public/data.json' EXIT
          printf '%s\n' '{"topic":"Prueba","title":"Prueba","duration":30,"fps":30,"beats":[],"captions":[],"caption_layout":{"y":0.5,"max_width":0.9,"max_text_px":900}}' > public/data.json
          node --input-type=module -e "import {bundle} from '@remotion/bundler'; import path from 'node:path'; await bundle({entryPoint: path.resolve('src/index.jsx')}); console.log('RENDER_BUNDLE_OK');"
      - name: Verify Python syntax
        run: python -m compileall -q pipeline.py smoke_render.py viral_visuals.py audio_design.py word_alignment.py narration_budget.py motion_math.py topic_research.py topic_guard.py response_shapes.py offline_voice.py native_spanish_voice.py spanish_voice_text.py voice_bank.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Headless B-roll, subtitles and mascot render smoke
        run: |
          python smoke_render.py
          cd render
          npm run render
          cd ..
          python - <<'PY'
          import json,subprocess
          path='work/silent.mp4'
          doc=json.loads(subprocess.check_output([
            'ffprobe','-v','error','-show_streams','-show_format',
            '-of','json',path],text=True))
          stream=next(v for v in doc['streams'] if v['codec_type']=='video')
          assert (stream['width'],stream['height'])==(1080,1920)
          assert float(doc['format']['duration'])>=3.4
          print('HEADLESS_BROLL_RENDER_OK',doc['format']['duration'])
          PY
