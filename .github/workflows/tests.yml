name: ABYSS WILD - Pruebas de codigo
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install FFmpeg for audio regression tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          command -v ffmpeg && command -v ffprobe
      - name: Install Python packages
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript motion geometry
        run: node --test render/tests/motion.test.mjs
      - name: Verify Python syntax
        run: python -m compileall -q pipeline.py motion_math.py topic_research.py topic_guard.py response_shapes.py offline_voice.py native_spanish_voice.py spanish_voice_text.py voice_bank.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
