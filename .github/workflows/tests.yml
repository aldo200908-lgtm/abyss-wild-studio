name: ABYSS WILD - Pruebas de codigo
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python packages
        run: python -m pip install -r requirements.txt
      - name: Verify Python syntax
        run: python -m compileall -q pipeline.py topic_research.py topic_guard.py response_shapes.py offline_voice.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
